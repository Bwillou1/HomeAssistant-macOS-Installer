# Home Assistant Desktop for macOS - Default Configuration
# Optimized configuration for macOS with native integrations

homeassistant:
  # Basic Information
  name: Home
  country: US
  language: en
  time_zone: UTC
  
  # macOS Specific Configuration
  internal_url: "http://homeassistant.local:8123"
  external_url: "https://homeassistant.local:8123"
  
  # Security Configuration
  allowlist_external_dirs:
    - "/Library/Application Support/HomeAssistant"
    - "/Library/Logs/HomeAssistant"
  
  # Advanced Configuration
  debug: false
  log_level: info

default_config:


# Logger configuration for macOS
logger:
  default: info
  logs:
    homeassistant.components: debug
    homeassistant.core: info
    homeassistant.helpers.script: warning
    homeassistant.components.zeroconf: debug

# Automatic device discovery
discovery:

# Zeroconf/Bonjour configuration for macOS
zeroconf:
  # Enable discovery via Bonjour
  default_interface: true
  
# HTTP configuration for macOS
http:
  server_port: 8123
  server_host: '0.0.0.0'
  cors_allowed_origins:
    - http://homeassistant.local:8123
    - https://homeassistant.local:8123
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

# Bluetooth configuration for macOS
bluetooth:
  # Use native macOS Bluetooth
  adapter: hci0
  scanning_mode: active

# macOS System Sensors configuration
sensor:

  # macOS Specific Sensors
  - platform: rest
    name: "macOS Version"
    resource: "http://localhost:8123/api/system_info"
    value_template: "{{ value_json.os_version }}"
    scan_interval: 3600

# macOS Switches configuration
switch:
  # System switch for macOS
  - platform: rest
    name: "Silent Mode"
    resource: "http://localhost:8123/api/system/silent_mode"
    body_on: '{"silent_mode": true}'
    body_off: '{"silent_mode": false}'

# macOS Binary Sensors configuration
binary_sensor:

# Mobile App configuration
mobile_app:

# macOS Notifications configuration
notify:
  # macOS System Notifications
  - platform: file
    name: "macOS Notifications"
    filename: "/tmp/ha_notifications.log"
    timestamp: true

# Automation configuration
automation:
  # Startup automation
  - alias: "Home Assistant Desktop Startup"
    description: "Actions on Home Assistant startup"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - service: system_log.write
        data:
          message: "Home Assistant Desktop for macOS started"
          level: info

  # System monitoring automation
  - alias: "High Memory Alert"
    description: "Alert when memory usage exceeds 80%"
    trigger:
      - platform: numeric_state
        entity_id: sensor.memory_use_percent
        above: 80
    action:
      - service: notify.persistent_notification
        data:
          title: "Memory Alert"
          message: "Memory usage: {{ states('sensor.memory_use_percent') }}%"

# macOS Scripts configuration
script:
  # Service restart script
  restart_homeassistant:
    alias: "Restart Home Assistant"
    sequence:
      - service: homeassistant.restart
      
  # Update script
  update_homeassistant:
    alias: "Update Home Assistant"
    sequence:
      - service: homeassistant.check_config
      - service: homeassistant.reload_core_config

# Scene configuration
scene:
  # Predefined scenes
  - name: "Night Mode"
    entities:
      light.living_room:
        state: off
        brightness_pct: 0
      light.bedroom:
        state: off
        brightness_pct: 10

# Group configuration
group:
  # System sensor groups
  system_sensors:
    name: "System Sensors"
    entities:
      - sensor.memory_use_percent
      - sensor.processor_use
      - sensor.disk_use_percent
      - sensor.load_1m
      
  # System switch groups
  system_switches:
    name: "System Controls"
    entities:
      - switch.silent_mode

# Recorder configuration
recorder:
  # Database optimized for macOS
  db_url: "sqlite:///config/home-assistant.db"
  purge_keep_days: 10
  commit_interval: 10
  include:
    entities:
      - sensor.*
      - binary_sensor.*
      - switch.*
  exclude:
    entities:
      - sensor.last_boot

# Detailed history configuration
history:

# Logbook configuration
logbook:

# Map configuration
map:

# Media source configuration
media_source:

# Streaming configuration
stream:

# Tag configuration
tag:

# Zone configuration
zone:
  # Home zone
  - name: Home
    latitude: 48.8566
    longitude: 2.3522
    radius: 100
    icon: mdi:home

# Input/Output configuration
input_boolean:
  # Boolean inputs for automations
  automatic_mode:
    name: "Automatic Mode"
    initial: true
    
  vacation_mode:
    name: "Vacation Mode"
    initial: false

input_number:
  # Number inputs for configuration
  target_temperature:
    name: "Target Temperature"
    min: 15
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

input_select:
  # Selection inputs
  heating_mode:
    name: "Heating Mode"
    options:
      - "Off"
      - "Eco"
      - "Comfort"
    initial: "Eco"
    icon: mdi:radiator

# Additional integrations configuration
frontend:
  # Web interface configuration
  themes:
    # Default macOS themes
    default:
      primary-color: "#41B883"
      accent-color: "#35495E"
      dark-primary-color: "#2c3e50"

# Config panel configuration
config:

# System health configuration
system_health:
